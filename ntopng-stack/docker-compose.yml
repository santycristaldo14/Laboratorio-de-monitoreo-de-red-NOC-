
services:

  # Recibe el NetFlow crudo del Mikrotik (puerto 2055/udp) y lo traduce
  # a un formato que ntopng entiende, publicándolo por ZMQ (puerto 5556).
  netflow2ng:
    image: synfinatic/netflow2ng:latest
    container_name: netflow2ng
    restart: unless-stopped
    entrypoint: /netflow2ng
    # host networking es obligatorio: si Docker hace NAT, el puerto de origen
    # de los paquetes NetFlow cambia y netflow2ng no los puede procesar bien.
    network_mode: host

  # Base de datos en memoria que usa ntopng para guardar estado (contadores,
  # cache de hosts, etc). No hay que tocarla, solo tiene que estar corriendo.
  redis:
    image: redis:alpine
    container_name: redis
    restart: unless-stopped
    network_mode: host 
    volumes:
      - redis_data:/data 
  # El dashboard web. Se conecta al ZMQ de netflow2ng en localhost:5556
  # (funciona porque los tres contenedores comparten la red del host).
  ntopng:
    image: ntop/ntopng:latest
    container_name: ntopng
    restart: unless-stopped
    network_mode: host
    
    volumes: 
      - ntopng_data:/var/lib/ntopng 
    depends_on:
      - netflow2ng
      - redis

    command:
      - "--community"
      - "--redis"
      - "localhost"
      - "--interface"
      - "tcp://localhost:5556"
      - "--local-networks"
      - "192.168.88.0/24"
  
  suricata:
    image: jasonish/suricata:latest
    container_name: suricata
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW 
      - SYS_NICE
    volumes:
      - suricata_logs:/var/log/suricata
      - suricata_rules:/var/lib/suricata
    command: -i enp0s31f6
   
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    network_mode: host
    environment:
      GF_INSTALL_PLUGINS: "alexanderzobnin-zabbix-app"
      GF_SERVER_HTTP_PORT: "3001"
    volumes:
      - grafana_data:/var/lib/grafana

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    network_mode: host
    volumes:
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: unless-stopped
    network_mode: host
    volumes:
      - suricata_logs:/var/log/suricata:ro
      - ./promtail-config.yaml:/etc/promtail/config.yaml
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      - loki

volumes:
  ntopng_data:
  redis_data:
  suricata_logs:
  suricata_rules:
  grafana_data:
  loki_data: 
