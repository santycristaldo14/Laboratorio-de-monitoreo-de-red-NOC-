networks:
  monitoring-net:
    external: true

services:
  # Base de datos donde Zabbix guarda toda su configuración, histórico de
  # métricas y eventos. Postgres en vez de MySQL porque consume menos RAM.
  postgres:
    image: postgres:15-alpine
    container_name: zabbix-postgres
    restart: unless-stopped
    networks:
      - monitoring-net
    environment:
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix_pass
      POSTGRES_DB: zabbix
    volumes:
      - zabbix_db_data:/var/lib/postgresql/data

  # El motor de Zabbix: sondea los dispositivos (SNMP al Mikrotik, agentes
  # en hosts), procesa los datos, dispara alertas según triggers.
  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-6.4-latest
    container_name: zabbix-server
    restart: unless-stopped
    networks:
      - monitoring-net
    depends_on:
      - postgres
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix_pass
      POSTGRES_DB: zabbix
      ZBX_DEBUGLEVEL: 4
    ports:
      - "10051:10051" # puerto donde escucha a los agentes/proxies

  # El dashboard web (nginx + PHP ya empaquetados en la imagen oficial).
  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-6.4-latest
    container_name: zabbix-web
    restart: unless-stopped
    networks:
      - monitoring-net
    depends_on:
      - postgres
      - zabbix-server
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix_pass
      POSTGRES_DB: zabbix
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: America/Argentina/Buenos_Aires
    ports:
      - "8081:8080" # acceso al dashboard: http://localhost:8081

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    networks:
      - monitoring-net
    depends_on:
      - zabbix-server
    enviroment:
      GF_INSTALL_PLUGINS: "alexanderzobnin-zabbix-app"
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  zabbix_db_data:
  grafana_data:
